services:
  # Proxy DNS sulla rete privata: permette ai container gVisor di risolvere
  # nomi Internet senza dipendere dal resolver loopback di Docker.
  dns:
    image: coredns/coredns:1.12.4
    container_name: isolated_vscode_dns
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.4

  # Docker-in-Docker separato: non monta il socket Docker dell'host e quindi
  # i comandi eseguiti da VS Code vedono soltanto questo daemon annidato.
  docker:
    image: docker:27-dind
    container_name: isolated_vscode_docker
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
    expose:
      - "2375"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - vscode_docker_data:/var/lib/docker
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.2

  # Gitea rootless con database SQLite incorporato.
  gitea:
    image: "docker.gitea.com/gitea:${GITEA_VERSION:-latest-rootless}"
    container_name: isolated_vscode_gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__server__DOMAIN: "${GITEA_DOMAIN:-gitea}"
      GITEA__server__SSH_DOMAIN: "${GITEA_DOMAIN:-gitea}"
      GITEA__server__ROOT_URL: "${GITEA_ROOT_URL:-http://gitea:3000/}"
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:-2225}"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-3001}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-2225}:2222"
    volumes:
      - ./gitea-data:/var/lib/gitea
      - ./gitea-config:/etc/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.10

  # Runner Actions con daemon Docker-in-Docker proprio e senza socket host.
  gitea-runner:
    image: "docker.io/gitea/runner:${GITEA_RUNNER_VERSION:-3}-dind"
    container_name: isolated_gitea_runner
    profiles: ["gitea-ci"]
    privileged: true
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: "${GITEA_RUNNER_URL:-http://gitea:3000}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_RUNNER_TOKEN:-}"
      GITEA_RUNNER_NAME: "${GITEA_RUNNER_NAME:-isolated-gitea-runner}"
      GITEA_RUNNER_LABELS: "${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:22-bookworm,ubuntu-22.04:docker://node:22-bookworm}"
      CONFIG_FILE: /runner-config/config.yaml
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - ./gitea-runner-data:/data
      - ./gitea-runner/config.yaml:/runner-config/config.yaml:ro
      - ./gitea-runner/daemon.json:/etc/docker/daemon.json:ro
      - gitea_runner_docker_data:/var/lib/docker
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.11

  # Daemon separato usato esclusivamente dagli stack gestiti da Dockge.
  # Non monta il socket Docker dell'host.
  dockge-docker:
    image: "docker:${DOCKGE_DOCKER_VERSION:-27}-dind"
    container_name: isolated_dockge_docker
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --insecure-registry=gitea:3000
    expose:
      - "2375"
    ports:
      # Le applicazioni annidate possono pubblicare soltanto questa fascia.
      - "127.0.0.1:${DOCKGE_APP_PORT_START:-18000}-${DOCKGE_APP_PORT_END:-18099}:18000-18099"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - ./dockge-docker-data:/var/lib/docker
      # Lo stesso percorso assoluto è montato anche in Dockge: i bind mount
      # relativi degli stack vengono così risolti dal daemon nel posto giusto.
      - ./dockge-stacks:/opt/stacks
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.12

  dockge:
    image: "louislam/dockge:${DOCKGE_VERSION:-1}"
    container_name: isolated_dockge
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://dockge-docker:2375
      DOCKGE_STACKS_DIR: /opt/stacks
      PUID: "1000"
      PGID: "1000"
    depends_on:
      dockge-docker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCKGE_HTTP_PORT:-5001}:5001"
    volumes:
      - ./dockge-data:/app/data
      - ./dockge-stacks:/opt/stacks
      # Credenziali dei registry separate da quelle dell'host.
      - ./dockge-docker-config:/root/.docker
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.13

  # Inizializza i volumi di Vikunja per il processo applicativo (UID 1000).
  vikunja-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:0 /db /files"]
    network_mode: none
    restart: "no"
    volumes:
      - vikunja_db:/db
      - vikunja_files:/files

  # Project/task manager leggero con database SQLite incorporato.
  vikunja:
    image: "vikunja/vikunja:${VIKUNJA_VERSION:-2.6.0}"
    container_name: isolated_vscode_vikunja
    restart: unless-stopped
    depends_on:
      vikunja-init:
        condition: service_completed_successfully
    environment:
      VIKUNJA_SERVICE_PUBLICURL: "${VIKUNJA_PUBLIC_URL:-http://localhost:3456/}"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    ports:
      - "127.0.0.1:${VIKUNJA_HTTP_PORT:-3456}:3456"
    volumes:
      - vikunja_db:/db
      - vikunja_files:/app/vikunja/files
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.14

  postgres:
    image: "postgres:${POSTGRES_VERSION:-17-alpine}"
    container_name: isolated_vscode_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Impostare POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.5

  redis:
    image: "redis:${REDIS_VERSION:-7.4-alpine}"
    container_name: isolated_vscode_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Impostare REDIS_PASSWORD}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.6

  mongodb:
    image: "mongo:${MONGO_VERSION:-8.0}"
    container_name: isolated_vscode_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Impostare MONGO_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE:-app}"
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - ./mongodb-data:/data/db
      - ./mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      vscode_docker:
        ipv4_address: 172.31.254.7

  volume-init:
    image: ghcr.io/coder/code-server:4.133.0
    runtime: runsc
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /data/codex /data/npm-global && chown -R 1000:1000 /config /data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # Necessaria per attraversare volumi persistenti gia' popolati e
      # correggerne l'ownership; il job non ha rete ne' bind mount host.
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    volumes:
      - vscode_config:/config
      - vscode_data:/data

  vscode:
    build:
      context: .
      args:
        CODEX_VERSION: 0.143.0
    image: isolated-code-server:4.133.0-codex
    container_name: isolated_vscode
    runtime: runsc
    user: "1000:1000"
    init: true
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
      docker:
        condition: service_healthy
      dns:
        condition: service_started

    # Pubblicazione diretta, limitata all'interfaccia loopback dell'host.
    ports:
      - "127.0.0.1:8443:8080"
    environment:
      PASSWORD: "${VSCODE_PASSWORD:?Impostare VSCODE_PASSWORD}"
      # Copilot CLI usa ~/.copilot per stato, sessioni e credenziali fallback.
      # La home generale resta read-only; solo questi percorsi sono scrivibili.
      COPILOT_HOME: /home/coder/.local/share/code-server/copilot
      COPILOT_CACHE_HOME: /home/coder/.cache/copilot
      # Configurazione, autenticazione e sessioni Codex persistono nel volume
      # isolato, mentre ~/.codex sulla root read-only non viene utilizzata.
      CODEX_HOME: /home/coder/.local/share/code-server/codex
      # npm usa cache effimera e installazioni globali persistenti nel volume,
      # senza tentare di scrivere in ~/.npm o /usr.
      NPM_CONFIG_CACHE: /home/coder/.cache/npm
      NPM_CONFIG_PREFIX: /home/coder/.local/share/code-server/npm-global
      # Il client controlla esclusivamente il daemon DinD dedicato. Nessun
      # /var/run/docker.sock dell'host viene esposto al container VS Code.
      DOCKER_HOST: tcp://docker:2375
      PATH: /home/coder/.local/share/code-server/npm-global/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - --disable-telemetry
      - --disable-update-check
      - /workspace

    # Espone soltanto questa directory dedicata. Da /workspace/.. il container
    # arriva alla propria root, non alla directory padre presente sull'host.
    volumes:
      - ./workspace:/workspace
      - vscode_config:/home/coder/.config
      - vscode_data:/home/coder/.local/share/code-server
      - ./coredns/vscode-resolv.conf:/etc/resolv.conf:ro

    networks:
      vscode_docker:
        ipv4_address: 172.31.254.3
    # Evita la dipendenza dal resolver Docker per raggiungere il daemon;
    # i nomi Internet continuano a usare resolver espliciti.
    extra_hosts:
      - "docker:172.31.254.2"
      - "gitea:172.31.254.10"
      - "postgres:172.31.254.5"
      - "redis:172.31.254.6"
      - "mongodb:172.31.254.7"
      - "vikunja:172.31.254.14"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,uid=1000,gid=1000
      - /home/coder/.cache:rw,nosuid,nodev,noexec,size=128m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0

volumes:
  vscode_config:
  vscode_data:
  vscode_docker_data:
  gitea_runner_docker_data:
  vikunja_db:
  vikunja_files:

networks:
  vscode_docker:
    # Nome stabile: evita che un diverso COMPOSE_PROJECT_NAME tenti di creare
    # una seconda rete con la stessa subnet 172.31.254.0/24.
    name: vscode-isolated_vscode_docker
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.254.0/24
