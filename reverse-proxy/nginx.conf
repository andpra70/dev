worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen 8080;
        set $upstream http://vscode:8080;
        location / { proxy_pass $upstream; }
    }

    server {
        listen 3001;
        client_max_body_size 512m;
        set $upstream http://gitea:3000;
        location / { proxy_pass $upstream; }
    }

    server {
        listen 5001;
        set $upstream http://dockge:5001;
        location / { proxy_pass $upstream; }
    }

    server {
        listen 3456;
        client_max_body_size 64m;
        set $upstream http://vikunja:3456;
        location / { proxy_pass $upstream; }
    }

    # App pubblicata dal daemon Docker-in-Docker gestito da Dockge.
    server {
        listen 18081;
        set $upstream http://dockge-docker:18081;
        location / { proxy_pass $upstream; }
    }
}
