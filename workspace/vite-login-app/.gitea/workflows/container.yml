name: Build and push container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io

      - name: Login al registry Gitea
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login gitea:3000 \
            --username "$REGISTRY_USER" --password-stdin

      - name: Build e push
        env:
          IMAGE: gitea:3000/${{ gitea.repository }}
          SHA_TAG: ${{ gitea.sha }}
          REF_NAME: ${{ gitea.ref_name }}
          REF_TYPE: ${{ gitea.ref_type }}
          DEFAULT_BRANCH: ${{ gitea.event.repository.default_branch }}
        run: |
          SAFE_REF="$(printf '%s' "$REF_NAME" | tr '[:upper:]/_' '[:lower:]--')"
          docker build --pull \
            --tag "$IMAGE:$SHA_TAG" \
            --tag "$IMAGE:$SAFE_REF" .
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$SAFE_REF"
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

